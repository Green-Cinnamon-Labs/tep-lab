# docker compose up        — sobe planta + historian + IHM
# docker compose up -d     — sobe em background
# docker compose down      — para tudo
#
# O Kind (plant-supervisor) continua sendo gerenciado pelo setup.sh,
# porque é um cluster Kubernetes e não um container simples.
#
# Fluxo de dados:
#   tep-plant ──OPC-UA :4840──▶ tep-historian ──HTTP :8090──▶ plant-supervisor (Kind)
#   tep-plant ──OPC-UA :4840──▶ tep-ihm (sinais ao vivo)
#   Kubernetes API ───────────▶ tep-ihm (veredito: Plant.status)

services:
  tep-plant:
    image: tep-plant:latest
    container_name: tep-plant
    ports:
      - "4840:4840"

  tep-historian:
    image: tep-historian:latest
    container_name: tep-historian
    ports:
      - "8090:8090"   # exposta no host: o supervisor no Kind chega por host.docker.internal:8090
    environment:
      - OPCUA_ENDPOINT=opc.tcp://tep-plant:4840/tep/server/
      - SAMPLE_INTERVAL_MS=500
      - RETENTION_S=3600
    depends_on:
      - tep-plant

  tep-ihm:
    image: tep-ihm:latest
    container_name: tep-ihm
    ports:
      - "8080:8080"
    environment:
      - OPCUA_ENDPOINT=opc.tcp://tep-plant:4840/tep/server/
      - K8S_SERVER=https://host.docker.internal:6443
      - K8S_CR_NAME=tep
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
      - ./data:/data
    depends_on:
      - tep-plant
