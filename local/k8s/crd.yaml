---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: costfunctions.supervision.greenlabs.io
spec:
  group: supervision.greenlabs.io
  names:
    kind: CostFunction
    listKind: CostFunctionList
    plural: costfunctions
    shortNames:
    - cf
    singular: costfunction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.unit
      name: Unit
      type: string
    - jsonPath: .spec.reference
      name: Reference
      type: number
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CostFunction is a declared objective function over plant signals.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CostFunctionSpec declares the objective function J = Σ terms.
            properties:
              reference:
                description: Reference is J at nominal operation, used for comparison
                  in status.
                type: number
              source:
                description: Source cites where the function comes from (paper, table).
                type: string
              terms:
                description: Terms summed to compute J.
                items:
                  description: |-
                    CostTerm is one additive term of the cost function: coefficient × Π mean(signal).

                    A term with one signal is linear (e.g. price × compressor power). A term with two signals is a
                    product (e.g. price × flow × composition). Unit conversions are folded into the coefficient.
                  properties:
                    coefficient:
                      description: Coefficient multiplies the product of the signals'
                        window means.
                      type: number
                    description:
                      description: Description is free text, typically how the coefficient
                        was derived.
                      type: string
                    name:
                      description: Name identifies the term in status (e.g. "purge.A").
                      minLength: 1
                      type: string
                    signals:
                      description: Signals are historian keys (OPC-UA browse names,
                        e.g. "xmeas.compressor.work").
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - coefficient
                  - name
                  - signals
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              unit:
                description: Unit of J (e.g. "$/h").
                minLength: 1
                type: string
            required:
            - terms
            - unit
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: operatingpolicies.supervision.greenlabs.io
spec:
  group: supervision.greenlabs.io
  names:
    kind: OperatingPolicy
    listKind: OperatingPolicyList
    plural: operatingpolicies
    shortNames:
    - op
    singular: operatingpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.costFunctionRef
      name: CostFunction
      type: string
    - jsonPath: .spec.maxCost
      name: MaxCost
      type: number
    - jsonPath: .spec.windowSeconds
      name: Window
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OperatingPolicy declares targets, constraints and a cost budget
          over a CostFunction.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OperatingPolicySpec is one way of operating the plant: what J must not exceed, which signals
              must hit which targets, and which limits must hold.
            properties:
              constraints:
                items:
                  description: |-
                    SignalConstraint asks a signal's window mean to stay within [Min, Max]. Either bound may be
                    omitted.
                  properties:
                    max:
                      type: number
                    min:
                      type: number
                    signal:
                      minLength: 1
                      type: string
                  required:
                  - signal
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - signal
                x-kubernetes-list-type: map
              controlLoops:
                description: |-
                  ControlLoops are judged separately from the economic verdict (condition ControlLoopsHealthy,
                  never PolicyCompliant): the two observation levels stay side by side.
                items:
                  description: |-
                    ControlLoop declares one control loop whose quality is monitored with the Predictability Index
                    of Bradu et al. (2017): how much of the loop error SP − PV an autoregressive model can predict.
                    The historian computes the index; the supervisor judges it against the thresholds below.
                  properties:
                    minOutputStd:
                      description: |-
                        MinOutputStd is the variability gate σ̄_y: the loop is only judged when the standard
                        deviation of its controller output is above it (a saturated, idle or manual loop is not).
                      minimum: 0
                      type: number
                    minPredictability:
                      description: 'MinPredictability is the threshold PI_L: below
                        it the loop is considered poorly tuned.'
                      maximum: 1
                      minimum: 0
                      type: number
                    name:
                      description: Name identifies the loop in status (e.g. "reactor_pressure").
                      minLength: 1
                      type: string
                    op:
                      description: OP is the historian key of the controller output
                        (e.g. the valve position).
                      minLength: 1
                      type: string
                    pv:
                      description: PV is the historian key of the measured variable.
                      minLength: 1
                      type: string
                    setpoint:
                      description: Setpoint of the loop, in the PV's unit.
                      type: number
                    timeConstantSeconds:
                      description: |-
                        TimeConstantSeconds is the closed-loop settling time T; it sets the prediction horizon
                        b = ceil(T / t_s).
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - minPredictability
                  - name
                  - op
                  - pv
                  - setpoint
                  - timeConstantSeconds
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              costFunctionRef:
                description: CostFunctionRef names a CostFunction in the same namespace.
                minLength: 1
                type: string
              description:
                description: Description is free text (e.g. "Downs & Vogel mode 1,
                  base case").
                type: string
              loopPersistenceEvaluations:
                default: 3
                description: |-
                  LoopPersistenceEvaluations is how many consecutive evaluations with an unhealthy loop are
                  needed before ControlLoopsHealthy turns False (Bradu's N).
                format: int32
                minimum: 1
                type: integer
              loopSampleIntervalSeconds:
                default: 1
                description: LoopSampleIntervalSeconds is the sampling time t_s the
                  historian resamples the series to.
                format: int32
                minimum: 1
                type: integer
              loopWindowSeconds:
                default: 300
                description: LoopWindowSeconds is the time window t_W over which each
                  loop's index is computed.
                format: int32
                minimum: 1
                type: integer
              maxCost:
                description: MaxCost is the budget for J. Omitted means J is observed
                  but not judged.
                type: number
              persistenceEvaluations:
                default: 1
                description: |-
                  PersistenceEvaluations is how many consecutive failing evaluations are needed before the
                  plant is declared non-compliant (persistence rule from control-loop performance monitoring,
                  Bradu et al. 2018), so short transients don't flip the verdict.
                format: int32
                minimum: 1
                type: integer
              targets:
                items:
                  description: SignalTarget asks a signal's window mean to stay within
                    ±TolerancePercent of Value.
                  properties:
                    signal:
                      minLength: 1
                      type: string
                    tolerancePercent:
                      minimum: 0
                      type: number
                    value:
                      type: number
                  required:
                  - signal
                  - tolerancePercent
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - signal
                x-kubernetes-list-type: map
              windowSeconds:
                default: 60
                description: WindowSeconds is the averaging window requested from
                  the historian.
                format: int32
                minimum: 1
                type: integer
            required:
            - costFunctionRef
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: plants.supervision.greenlabs.io
spec:
  group: supervision.greenlabs.io
  names:
    kind: Plant
    listKind: PlantList
    plural: plants
    singular: plant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.activePolicy
      name: Policy
      type: string
    - jsonPath: .status.cost.value
      name: Cost
      type: number
    - jsonPath: .status.cost.unit
      name: Unit
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="ControlLoopsHealthy")].status
      name: Loops
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plant is an industrial plant observed by the supervisory layer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlantSpec points the operator at a plant's historian and
              at the policy currently in force.
            properties:
              evaluationIntervalSeconds:
                default: 30
                description: EvaluationIntervalSeconds is how often the plant is evaluated.
                format: int32
                minimum: 1
                type: integer
              historianURL:
                description: HistorianURL is the base URL of the historian (e.g. "http://tep-historian:8090").
                minLength: 1
                type: string
              policyRef:
                description: PolicyRef names the active OperatingPolicy in the same
                  namespace.
                minLength: 1
                type: string
            required:
            - historianURL
            - policyRef
            type: object
          status:
            description: PlantStatus is the supervisory layer's verdict about the
              plant.
            properties:
              activePolicy:
                description: ActivePolicy is the policy the verdict refers to.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveLoopViolations:
                description: ConsecutiveLoopViolations counts consecutive evaluations
                  with at least one unhealthy loop.
                format: int32
                type: integer
              consecutiveViolations:
                description: ConsecutiveViolations counts consecutive failing evaluations
                  under ActivePolicy.
                format: int32
                type: integer
              constraints:
                items:
                  description: ConstraintResult is the outcome of one SignalConstraint.
                  properties:
                    observed:
                      type: number
                    satisfied:
                      type: boolean
                    signal:
                      type: string
                  required:
                  - satisfied
                  - signal
                  type: object
                type: array
              cost:
                description: CostStatus is the evaluated value of J.
                properties:
                  maxCost:
                    type: number
                  reference:
                    type: number
                  unit:
                    type: string
                  value:
                    type: number
                required:
                - unit
                - value
                type: object
              lastEvaluationTime:
                format: date-time
                type: string
              loops:
                description: Loops is the per-loop result of the second observation
                  level.
                items:
                  description: LoopStatus is the quality of one control loop in the
                    last evaluation.
                  properties:
                    evaluated:
                      description: |-
                        Evaluated is false when the loop could not be judged: no index (e.g. too few samples) or
                        controller output below the variability gate.
                      type: boolean
                    healthy:
                      description: Healthy is false only for an evaluated loop with
                        Predictability below its threshold.
                      type: boolean
                    name:
                      type: string
                    offset:
                      description: Offset is the mean loop error SP − PV (a proportional
                        controller keeps one).
                      type: number
                    outputStd:
                      description: OutputStd is the standard deviation of the controller
                        output over the window.
                      type: number
                    predictability:
                      description: Predictability is the Predictability Index PI (0–1)
                        of the loop error's fluctuation.
                      type: number
                    reason:
                      description: Reason explains Evaluated=false or Healthy=false.
                      type: string
                  required:
                  - evaluated
                  - healthy
                  - name
                  type: object
                type: array
              phase:
                description: PlantPhase summarizes the verdict.
                enum:
                - Pending
                - Compliant
                - NonCompliant
                type: string
              targets:
                items:
                  description: TargetResult is the outcome of one SignalTarget.
                  properties:
                    met:
                      type: boolean
                    observed:
                      type: number
                    signal:
                      type: string
                    target:
                      type: number
                  required:
                  - met
                  - signal
                  - target
                  type: object
                type: array
              terms:
                items:
                  description: TermContribution is one term's share of J.
                  properties:
                    name:
                      type: string
                    value:
                      type: number
                  required:
                  - name
                  - value
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
