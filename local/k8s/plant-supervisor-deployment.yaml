# Deploy do plant-supervisor.
# Ele avalia cada Plant contra a OperatingPolicy ativa, lendo médias por janela do tep-historian
# via HTTP. Não fala com a planta diretamente.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-supervisor
  labels:
    app: plant-supervisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plant-supervisor
  template:
    metadata:
      labels:
        app: plant-supervisor
    spec:
      serviceAccountName: plant-supervisor
      containers:
        - name: manager
          image: plant-supervisor:latest
          imagePullPolicy: Never   # imagem carregada via `kind load`
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# ServiceAccount + RBAC mínimo (espelha plant-supervisor/config/rbac/role.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plant-supervisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plant-supervisor-role
rules:
  - apiGroups: ["supervision.greenlabs.io"]
    resources: ["costfunctions", "operatingpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["supervision.greenlabs.io"]
    resources: ["plants"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["supervision.greenlabs.io"]
    resources: ["plants/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election (controller-runtime)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plant-supervisor-rolebinding
subjects:
  - kind: ServiceAccount
    name: plant-supervisor
    namespace: default
roleRef:
  kind: ClusterRole
  name: plant-supervisor-role
  apiGroup: rbac.authorization.k8s.io
