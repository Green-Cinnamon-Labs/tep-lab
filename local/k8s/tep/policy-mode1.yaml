# Política Modo 1 (caso base) do TEP — Downs & Vogel (1993).
#
# - Metas: vazão de produto e composição G/H do caso base (Tabelas 4 e 5), com a tolerância de
#   ±5 % que o artigo usa para variabilidade aceitável do produto. A razão G/H 50/50 do Modo 1 não
#   é um sinal único, então é expressa como metas em G e H separadamente.
# - Restrições: limites normais de operação da Tabela 6 (não os de shutdown).
# - Orçamento de custo: 170.6 $/h, o custo do caso base de Downs & Vogel (Tabela 9). Calibrado em
#   2026-10-08 (bloco 6 da #85): J nominal = 166.83 ± 0.18 $/h, então J precisa subir ~2.3 % para
#   estourar. Antes era 179 (escolha arbitrária, 7 % acima do nominal).
# - Malhas de controle (segundo nível de observação, spec #85): os 3 controladores P do TEP, julgados
#   pelo Predictability Index de Bradu et al. (2017) num veredito separado (ControlLoopsHealthy). Os
#   setpoints são as constantes do código da planta (tep-plant/src/controllers/). Limiares
#   calibrados em 2026-10-08 (bloco 6 da #85), operação nominal com ruído, velocidade 5, 41 avaliações
#   (tep-lab/data/experiment_82/calibracao_2026-10-08.csv):
#   - níveis: PI entre 0.147 e 0.40 → minPredictability 0.12 (abaixo do mínimo, com margem);
#     σ da válvula 0.28–0.34 % → passam folgados no portão de 0.05 %.
#   - pressão: σ da válvula 0.012–0.015 % → fica abaixo do portão de 0.05 % e não é julgada (#86).
#   Os limiares do artigo (PI_L 0.4, σ̄_y 1 %) não se transferem (#87).
apiVersion: supervision.greenlabs.io/v1alpha1
kind: OperatingPolicy
metadata:
  name: tep-mode1
spec:
  costFunctionRef: tep-downs-vogel
  description: "Downs & Vogel mode 1 (base case): 50/50 G/H, product 22.949 m³/h"
  windowSeconds: 60
  maxCost: 170.6
  persistenceEvaluations: 3
  targets:
    - signal: xmeas.stream11.flow_rate      # XMEAS(17), m³/h
      value: 22.949
      tolerancePercent: 5
    - signal: xmeas.stream11.component.g    # XMEAS(40), mol%
      value: 53.724
      tolerancePercent: 5
    - signal: xmeas.stream11.component.h    # XMEAS(41), mol%
      value: 43.828
      tolerancePercent: 5
  constraints:
    - signal: xmeas.reactor.pressure        # XMEAS(7), kPa
      max: 2895
    - signal: xmeas.reactor.level           # XMEAS(8), %
      min: 50
      max: 100
    - signal: xmeas.reactor.temperature     # XMEAS(9), °C
      max: 150
    - signal: xmeas.separator.level         # XMEAS(12), %
      min: 30
      max: 100
    - signal: xmeas.stripper.level          # XMEAS(15), %
      min: 30
      max: 100

  # ── Malhas de controle (segundo nível) ──────────────────────────────────────────────────────────
  loopWindowSeconds: 300            # t_W: janela do índice
  loopSampleIntervalSeconds: 1      # t_s: o historian reamostra as séries para este passo
  loopPersistenceEvaluations: 3     # N de Bradu
  controlLoops:
    - name: reactor_pressure
      pv: xmeas.reactor.pressure              # XMEAS(7), kPa
      setpoint: 2705
      op: valve.purge.position                # XMV(6), %
      timeConstantSeconds: 30
      minPredictability: 0.12
      minOutputStd: 0.05                      # a válvula de purga varia 0.012–0.015 %: não é julgada
    - name: separator_level
      pv: xmeas.separator.level               # XMEAS(12), %
      setpoint: 50
      op: valve.separator_underflow.position  # XMV(7), %
      timeConstantSeconds: 30
      minPredictability: 0.12
      minOutputStd: 0.05
    - name: stripper_level
      pv: xmeas.stripper.level                # XMEAS(15), %
      setpoint: 50
      op: valve.stripper_product.position     # XMV(8), %
      timeConstantSeconds: 30
      minPredictability: 0.12
      minOutputStd: 0.05
