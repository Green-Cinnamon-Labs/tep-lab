# Kind cluster config para o lab TEP local.
# Cluster name: tep-lab
#
# A planta e o historian rodam fora do Kind (compose ou nativo).
# O operator roda dentro do Kind e consulta o historian via host.docker.internal:8090.
#
# Uso: kind create cluster --config kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tep-lab
networking:
  apiServerPort: 6443
nodes:
  - role: control-plane
